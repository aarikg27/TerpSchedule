[project]
name = "terpschedule-backend"
version = "1.0.0"
description = "Course schedule optimizer for UMD students"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "icalendar>=5.0.0",
    "pytz>=2025.1",
    "pydantic-settings>=2.3.0",
    "cachetools>=5.3.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
